version: 2
updates:
  - package-ecosystem: npm
    directory: /image-uploader
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Angular pins these ranges; let Angular upgrades move them.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
    groups:
      angular:
        patterns: ["@angular/*", "ng-packagr", "zone.js"]
      dev-tooling:
        patterns: ["vitest", "jsdom", "typescript", "prettier"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
